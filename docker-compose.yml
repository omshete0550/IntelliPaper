services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellipaper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellipaper"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      CORPUS_DIRECTORY: /app/data/corpus
    volumes:
      - ./ml-service/data/corpus:/app/data/corpus:ro
    expose:
      - "8000"

  api:
    build: ./server
    restart: unless-stopped
    command: sh -c "npx prisma db push --skip-generate && node index.js"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/intellipaper?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      SIMILARITY_SERVICE_URL: http://ml-service:8000
    depends_on:
      database:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "5000:5000"

volumes:
  postgres_data:
